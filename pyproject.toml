[project]
name = "inference-from-the-metal-up"
version = "0.1.0"
description = "Computer architecture, metal to token — reproducible artefacts for understanding LLM inference from first principles."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Oscar Alateras" }]
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    # Pinned to torch 2.8.0 on CUDA 12.8 — the exact stack T7's lab note records, so `uv sync`
    # reproduces the committed results rather than approximating them. Newer torch only
    # ships as cu130, which requires driver >= 580 — on a CUDA 12.8 host it installs cleanly and
    # then reports `cuda.is_available() == False`, so the GPU tests *skip* and CI stays green while
    # nothing is tested. cu128 runs on driver 12.8 and on everything newer (CUDA minor-version
    # compatibility), so this is the portable pin, not the conservative one.
    "torch==2.8.0",
    "safetensors>=0.8.0",
    # Held below 1.0 because transformers 4.57.x requires it — see the transformers pin. The two
    # move together, so pinning one without the other just relocates the conflict.
    "huggingface-hub>=0.34,<1.0",
    # Upper-bounded deliberately. transformers 5.x removed `all_special_tokens_extended`, which
    # vLLM 0.11 calls during tokenizer init — yet vLLM declares only `transformers>=4.55.2`, so its
    # own metadata does not stop the break. An unbounded pin here resolved 5.14.1 and T6 failed
    # before the engine finished starting. Same class of bug as the torch pin: a floor without a
    # ceiling is not a pin.
    "transformers>=4.57,<5",
    # T8's kernel. Pinned directly rather than left to resolve transitively through torch: Triton's
    # codegen and autotuner change between minors, so a floating version would make the kernel's
    # numbers irreproducible. CUDA-only, hence the marker — it is absent on the authoring Mac, and
    # `kernel.py` degrades to an import guard there.
    "triton>=3.4,<3.5 ; sys_platform == 'linux'",
    # T6's system under test. Linux+CUDA only, so it is marked rather than left to fail on macOS,
    # and pinned rather than installed ad-hoc on whichever pod happens to be running — which is how
    # T6's original stack came to be unrecorded. vLLM changes decode scheduling and CUDA-graph
    # capture between minors, both of which T6 measures directly, so an unpinned version means the
    # error budget is not reproducible even on identical hardware.
    "vllm>=0.11,<0.12 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "pre-commit>=3.8",
]

[tool.uv]
# Not a distributable package — a repo of topic artefacts. uv just manages the venv + deps.
package = false

# PyPI serves whichever CUDA build torch has decided is current, which is how this repo ended up
# with a cu130 wheel that could not see the GPU. Resolve torch from the cu128 index explicitly, on
# Linux only — the index carries no macOS wheels, so the authoring machine falls back to PyPI and
# gets the CPU build it wants.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["arch_common", "topics", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# vLLM and Triton are Linux+CUDA only and genuinely absent on the authoring machine.
reportMissingImports = "warning"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests", "topics"]
pythonpath = ["."]
addopts = "-q"
